name: Lúmina · verificaciones
on:
  push:
    branches: [main]
  pull_request:
jobs:
  arte-y-sintaxis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar build autónomo y escenas
        run: |
          node tests/v048-art-smoke.mjs
          node tests/v050-progress-smoke.mjs
          node tests/v060-missions-smoke.mjs
          node tests/v070-refugio-smoke.mjs
          node tests/v071-wayfinding-smoke.mjs
          node tests/v080-transfer-smoke.mjs
          node tests/v090-story-smoke.mjs
          node tests/v091-audio-smoke.mjs
          node tests/v093-polish-smoke.mjs
          node tests/v094-physics-playtest.mjs
          node tests/v094-guidance-smoke.mjs
          node tests/v095-controller-smoke.mjs
          node --check controller-system.js
          node --check guided-help.js
          node --check physics-engine.js
          # PNG signature and availability are checked in v048-art-smoke.mjs
          node --check polish-system.js
          node --check audio-system.js
